server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 15m;

    # Use Docker's embedded DNS resolver so the backend hostname is
    # resolved at request time, not at nginx startup. Without this,
    # nginx crashes with "host not found in upstream" if the backend
    # container isn't up yet. ipv6=off avoids AAAA SERVFAIL errors.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Proxy API calls to the Express backend by service name.
    location /api/ {
        set $backend_upstream http://backend:3001;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — every non-file route serves index.html so the
    # Vue router (including /backstage) works on direct load / refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
